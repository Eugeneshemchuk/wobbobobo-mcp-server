services:
  # Self-hosted Bot API: lifts the bot download limit from 20MB to 2GB.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      DATA_DIR: /data
      TELEGRAM_FILES_DIR: /var/lib/telegram-bot-api
    volumes:
      - ./data:/data
      - ./content:/app/content:ro
      # Same path as in the API container: in local mode get_file returns a local path.
      - tg-data:/var/lib/telegram-bot-api
    depends_on: [telegram-bot-api]
    restart: unless-stopped

volumes:
  tg-data:
