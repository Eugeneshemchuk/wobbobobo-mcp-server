# Style and effects. Edits apply to the next job - no rebuild needed.
#
# Any key below can be overridden for one job by putting key=value in the Telegram
# text or video caption, e.g.:   Discipline is choosing what you want most. fractal_s=8 hue_cycle_s=4
# Flags are stripped before rendering, so they never show up in the captions.
# Values with spaces need quotes: font="Bebas Neue". On/off keys take on/off, yes/no, 1/0.
# Sections are only for reading - flag names are the bare keys, so keep them unique.

[captions]
font = "DejaVu Sans"
caption_size = 84          # word-by-word captions
quote_size = 62            # quote at the top
highlight = "#FFE500"      # current word
words_per_line = 3
caption_y = 0.78           # caption baseline, fraction of the height from the top (was 0.71)

[hook]                     # attention grab on the first moments of every clip
hook = "both"              # glitch | shake | both | off
hook_s = 0.5               # seconds
hook_strength = 1.0        # 0.5 subtle ... 2 wild

[video]                    # uploaded footage
fractal = 0                # Mandelbrot overlay 0 (off) - 7 (max); 5+ mirrors the footage, 7 adds hue cycling
overlay_zoom_start = 3.0   # zoom over the clip: smaller = deeper
overlay_zoom_end = 0.02

[text]                     # text-only clips (no video)
look = "drift"             # neon (black blackletter card, neon fractal) | pixel (yellow/blue pixel card)
                           # | drift (hook text over a Fractal Drift dive from the first frame)
pace = 0.4                 # seconds per hook word (without voiceover; with it, the voice sets the pace)
fractal_s = 4.5            # minimum seconds of fractal after the title card
loop_align = true          # with the bassline: stretch to end on a whole bass loop (8s or 12s at 60 bpm)
max_mb = 10.0              # final file size cap for text and voice clips; the bitrate follows from the length

# neon look
neon_font = "UnifrakturMaguntia"   # any font in content/fonts or the image; blackletter stays in mixed case
neon_line = "#FFFFFF"      # outline of the hollow lettering
neon_glow = "#8C3CFF"      # glow around the lettering
neon_highlight = "#BEFF28" # fill of the current word
neon_caption_y = 0.62      # hook baseline on the black card (was centred)
glow = 10                  # glow blur, 0 = off
neon_palette = "#000000 #3A0CA3 #8C3CFF #FF4FD8 #BEFF28"  # fractal recolour, dark -> bright
bloom = 0.35               # soft glow on the fractal, 0 - 1

# pixel look
card_left = "#FFFF00"
card_right = "#0000FF"
line = true                # rising diagonal line
line_from = "#00FFFF"
line_to = "#FF00FF"
checker = true             # checker strip on the right edge
checker_color = "#1E78C8"
pixels = true              # blinking pixels top right

# drift look - the Fractal Drift page (eugeneshemchuk.github.io/Portfolio/fractal)
drift_style = "random"     # random (a new look per clip: a preset or a generated palette, with spin, density,
                           #   framing and colour drift varied) | classic | midnight | ocean | ember | neon | topo
drift_target = "random"    # random (one of the detail-rich ones) | seahorse | elephant | bulb | "seahorse spiral"
                           #   | tendrils | "classic spiral" | "top spiral" | "elephant spirals" | "needle spiral" | star
drift_speed = 0.8          # motion pace - zoom, spin, glide, colour drift; 1 = ~500x zoom in 12s, 0 = still
drift_quality = "fast"     # fast: anti-aliased keyframes, no warp | full: every frame computed, exact, no AA

# fractal (neon and pixel looks)
zoom_start = 1.2           # smaller = deeper; the zoom drifts from start to end
zoom_end = 0.6
detail = 256               # max iterations: higher = finer edges, slower render
mirror = false             # kaleidoscope symmetry
hue_cycle_s = 0.0          # seconds per full colour cycle, 0 = off

# audio - a new track per clip by default: TikTok flagged the same bassline on every upload
audio = "ambient"          # ambient: meditative MIDI bed - pad drone, slow chords, bells, reverb, binaural sub
                           # | gen: synth bassline + arpeggio | bass: bass_notes | drone | off
sub_level = 0.15           # ambient: deep sine sub under the bed, 0 = off
bass_notes = "A1"          # audio=bass only: one note per beat, loops; e.g. bass_notes="A1 A1 C2 G1"
bpm = 60                   # audio=bass only; gen picks 72-104
drone_hz = 110.0

[voiceover]                # typed text read aloud; voice messages keep your own voice
voiceover = true
tts = "kokoro"             # kokoro: open neural voice, runs in the worker | say: macOS voice via tts_host.py
kokoro_voice = "am_onyx"     # male: am_onyx am_michael am_fenrir am_adam am_eric am_liam am_echo am_puck,
                           #   British bm_george bm_lewis bm_daniel bm_fable; female: af_heart af_bella bf_emma ...
kokoro_speed = 0.8         # 1 = normal; 0.8 = 20% slower
voice = "Daniel"           # tts=say only: any name from `say -v '?'`
voice_rate = 125           # tts=say only: say -r; 125 is 20% slower than its default 175
music_level = 0.25         # music volume under the voice, 0 - 1
